name: qian-shell-auth

# 外壳认证验收：执行 pnpm shell:auth，跑外壳认证的真实流程（验收范围见原件的注释）。
# 由 ci.yml 调用，在仓库根目录运行。
# 原件在 _import/qian/.github/workflows/shell-auth.yml，B1 历史导入时带来，不动，GitHub 不读。相对原件的改动：
# - 触发：只留 workflow_call 与 workflow_dispatch；推送与拉取请求的触发、路径过滤与并发组都由 ci.yml 管（S1-KUN-020）。
#   路径过滤在区域表 scripts/ci_changes.py 的 shell-auth 区域：原件的过滤逐条加 _import/qian/ 前缀，另加仓库根的 .NET 构建基线、
#   Kun.slnx、src/ 与 _import/qian/.npmrc；指向已不存在的 _import/qian/NuGet.config 的一条删掉。
# - 位置：run 步骤的工作目录、package.json 与上传路径加 _import/qian/ 前缀；setup-dotnet 读仓库根的 global.json。
# - 前端框架迁出（B11，见迁移执行计划）之后：前端框架装 CavaiLAB/qian 发布在 GitHub Packages 上的公开包
#   @cavailab/qian-*，用本次运行的 GITHUB_TOKEN 只读安装：权限加 packages: read，setup-node 写用户级的
#   包源认证，pnpm install 带 NODE_AUTH_TOKEN；区域里去掉迁走的目录。
# 检查本身不变。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 shell-auth），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
jobs:
  acceptance:
    name: 外壳认证真实流程验收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian-shell exec playwright install --with-deps chromium
      - run: pnpm exec turbo run typecheck --filter=@qian/identity-ui --filter=@qian/shell-kit --filter=@qian/sample-crm-ui --filter=@qian/tenancy-ui --filter=@qian/tenancy-signup-ui --filter=qian-shell
      - name: 真实流程验收（与本机 scripts/dev-shell.sh e2e 同一入口）
        run: pnpm shell:auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-auth-acceptance
          path: TestResults/shell-auth/
          if-no-files-found: ignore
