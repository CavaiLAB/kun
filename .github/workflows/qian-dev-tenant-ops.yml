name: qian-dev-tenant-ops

# 运行 scripts/dev-tenant-ops.sh smoke 验收租户运营宿主。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 dev-tenant-ops），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  smoke:
    name: 手测环境冒烟（up + walkthrough）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 起环境、走查、停宿主（与本机 scripts/dev-tenant-ops.sh smoke 同一条命令）
        env:
          QIAN_DEV_SMOKE_LOG: ${{ runner.temp }}/dev-tenant-ops-up.log
        run: scripts/dev-tenant-ops.sh smoke

      - name: 失败时上传宿主日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-tenant-ops-up-log
          path: ${{ runner.temp }}/dev-tenant-ops-up.log
          if-no-files-found: ignore
