name: qian-directory-e2e

# 使用 tests/directory-e2e 工作区包验收真实目录选择器。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 directory-e2e），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  acceptance:
    name: 真实目录选择器验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @qian/directory-e2e exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project ui-gates tests/gates/ui/pins.test.ts && pnpm --filter @qian/directory-e2e typecheck
      - run: pnpm --filter @qian/directory-e2e e2e:directory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-e2e
          path: TestResults/directory-e2e/
          if-no-files-found: ignore
