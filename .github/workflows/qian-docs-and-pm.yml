name: qian-docs-and-pm

# ci.yml 根据文档和看板路径调用。所有步骤在仓库根运行。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 docs-and-pm），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 文档门禁（禁用词 / 表格 / 链接）
        run: python3 scripts/check_docs.py
      - name: 任务文件校验
        run: python3 scripts/pm.py validate
      # 看板生成物不进 git（S1-PM-004）：这里只确认能生成，并把看板上传为产物，可下载后离线打开
      - name: 生成看板
        run: python3 scripts/pm.py build --out "$RUNNER_TEMP/pm-board"
      - uses: actions/upload-artifact@v4
        with:
          name: pm-board
          path: ${{ runner.temp }}/pm-board
          retention-days: 14
      # 看板 Pod 的构建容器（deploy/pm-board/builder.py）的自测，只用标准库（S1-PM-005）
      - name: 看板 builder 自测
        run: python3 -m unittest discover -s deploy/pm-board -p 'test_*.py' -v
