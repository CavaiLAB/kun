name: kun-ci

# 原 Kun 的 CI，B1 历史导入时接到本仓库（迁移执行计划 B1，S1-KUN-019）；B2 把原 Kun 提到仓库根之后改为在仓库根运行。
# 原件在 .github/originals/kun/workflows/ci.yml，不动（B2 从 _import/kun/.github/ 挪过去，GitHub 不读那一层）。
# 相对原件的改动：
#   - runs-on 由自托管的 [self-hosted, qd] 改为 GitHub 托管的 ubuntu-24.04（本仓库没有接自托管 runner）。
#     qd 是 Ubuntu 24.04，这里钉同一个 LTS：这是托管 runner 里与原件最接近的环境，也不会随 ubuntu-latest
#     改指向（现在已是 ubuntu-26.04）而漂移。钉版本身与 Sample AOT Integration 的 MSB4216 无关，见下一条；
#   - Sample AOT Integration 的 setup-dotnet 装到独立目录（DOTNET_INSTALL_DIR），目录里只有 global.json 解析出的 SDK。
#     托管镜像预装了 .NET SDK 11.0.100，qd 上没有。网关包独立消费者在仓库外（没有 global.json）发布时会选到它，
#     而外层 dotnet test 传下来的 MSBuildSDKsPath、MSBuildExtensionsPath 指向 10.0.404，MSBuild 11 去起 10.0.404
#     的 .NET 任务宿主，握手对不上（MSB4216）。装到独立目录后仓库内外都用 10.0.404，与 qd 上的情形一致；
#   - 原件不设路径过滤（原仓库里每个改动都属于原 Kun）。这里只在原 Kun 的代码、构建文件与本文件改动时运行：
#     只改 _import/ 下的原 Qian、只改文档（仓库根的说明文件、docs/、各目录里的 Markdown）都不触发。
#     打进网关包的 src/Kun.Gateway/GATEWAY.md 例外，打包冒烟会用到它；
#   - 显式写出 permissions: contents: read；
#   - 构建并轨（S1-KUN-020）：测试运行器统一到 Microsoft.Testing.Platform（global.json 的 test.runner），
#     xunit.v3 4.x 不再支持 VSTest。按全名子串排除的 --filter 改为解决方案筛选文件 tests/kun-unit.slnf：
#     它列出 Kun.sln 里除 Kun.IntegrationTests、Kun.Sample.Tests、Kun.Integration.AotTests 之外的全部测试项目，
#     与原件的排除条件等价。覆盖率由 coverlet.collector 换成 coverlet.MTP，文件名带时间戳，上传匹配式随之改，
#     找不到文件即失败；集成测试与 AOT 测试用 --project 指定项目。
# 命令都在仓库根运行，与原件相同；作业与步骤照原件，不增不减，测试命令按上一条改写。
# 没接的原 Kun 工作流：benchmarks.yml（基准，只在自托管 runner 上跑）、oss-live-smoke.yml（对象存储实测，
# 要自托管 runner 与 OSS_SMOKE_* 密钥）、release.yml（发版，推 nuget.org 与 GitHub Packages）、
# release-drafter.yml（发布说明草稿），说明见 .github/originals/kun/README.md。

on:
  push:
    branches: [main, develop]
    paths: &kun-paths
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - 'benchmarks/**'
      - 'tools/**'
      - 'scripts/**'
      - '!**/*.md'
      - 'src/Kun.Gateway/GATEWAY.md'
      - 'Kun.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/kun-ci.yml'
  pull_request:
    branches: [main, develop]
    paths: *kun-paths

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    # No `services:` block — Testcontainers spins up its own containers on demand.
    # A GitHub-managed postgres/rabbitmq/redis service block wastes time and causes
    # port conflicts when Testcontainers also tries to bind the same ports.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Release version and artifact validation tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_version.py' -v

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Gateway package smoke
        run: |
          dotnet pack src/Kun.Gateway -c Release --no-build --no-restore -o artifacts/gateway-package
          test -f artifacts/gateway-package/Kun.Gateway.*.nupkg

      # Unit tests only — fast, no external deps.
      # Kun.IntegrationTests: runs in a separate step below (Testcontainers).
      # Kun.Integration.AotTests: runs in the sample-aot-integration job
      #   so the matrix can install clang alongside dotnet publish.
      # Kun.Sample.Tests: excluded from CI because these tests require Aspire
      #   service-discovery env vars (services__catalog__*, etc.) that CI does
      #   not set. TODO: add a dedicated integration-compose job that wires the
      #   Aspire manifest so Sample.Tests can run in CI.
      # tests/kun-unit.slnf lists every test project in Kun.sln except the three
      # above, which is what the original --filter excluded (S1-KUN-020).
      - name: Unit Tests
        run: >
          dotnet test
          --solution tests/kun-unit.slnf
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --results-directory TestResults/unit

      # Testcontainers integration tests — ubuntu-24.04 自带 Docker（原件跑在自带 Docker 的自托管 runner 上）。
      - name: Integration Tests (Testcontainers)
        run: >
          dotnet test
          --project tests/Kun.IntegrationTests/Kun.IntegrationTests.csproj
          --configuration Release
          --no-build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/unit/coverage.cobertura.*.xml
          if-no-files-found: error

  # Full-module AOT audit — every IsAotCandidate=true project is fanned
  # out across a job matrix so a trim / AOT regression in one module
  # does not mask another, and the reported failure points directly
  # at the offending project. See
  # docs/architecture/AOT-audit-2026-04-23.md for the module-status
  # matrix. Intentionally-excluded non-AOT modules (AspNetCore, Dapper,
  # Saga, EntityFrameworkCore + its adapters) are not in this matrix
  # and stay covered by the Build & Test job.
  aot-audit:
    name: AOT Audit — ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - Kun.Audit
          - Kun.Authorization
          - Kun.Configuration.Apollo
          - Kun.Caching
          - Kun.Configuration
          - Kun.Core
          - Kun.EventBus
          - Kun.EventBus.Abstractions
          - Kun.EventBus.RabbitMQ
          - Kun.Gateway
          - Kun.Grpc
          - Kun.Identity
          - Kun.Infrastructure
          - Kun.Mediator
          - Kun.MultiTenancy
          - Kun.Observability
          - Kun.RateLimit
          - Kun.Sandbox
          - Kun.Security
          - Kun.Storage
          - Kun.Validation

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        # ubuntu-24.04 自带 clang 与 zlib1g-dev，通常跳过；缺失时才 sudo apt（托管 runner 有免密 sudo）。
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Publish AOT (zero trim / AOT warnings, warnings-as-errors)
        run: |
          dotnet publish "src/${{ matrix.module }}" \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=true

  # Runs Kun.Integration.AotTests, which AOT-publishes
  # samples/Kun.Sample.Minimal and executes the produced native binary.
  # 同时普通打包 Kun.Gateway，再发布独立 NuGet 消费者并请求原生 JWKS 端点。
  # Requires clang + zlib1g-dev for the NativeAOT linker step. See
  # tests/Kun.Integration.AotTests/AGENTS.md.
  sample-aot-integration:
    name: Sample AOT Integration
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          # 只装 global.json 解析出的 SDK，不用托管镜像预装的那一套（其中有 SDK 11.0.100），原因见文件开头。
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        # ubuntu-24.04 自带 clang 与 zlib1g-dev，通常跳过；缺失时才 sudo apt（托管 runner 有免密 sudo）。
        run: |
          if ! command -v clang >/dev/null 2>&1 || [ ! -f /usr/include/zlib.h ]; then
            sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Restore
        run: dotnet restore tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj

      - name: Build
        run: >
          dotnet build tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj
          --configuration Release
          --no-restore

      - name: Run AOT integration tests
        run: >
          dotnet test
          --project tests/Kun.Integration.AotTests/Kun.Integration.AotTests.csproj
          --configuration Release
          --no-build

  format:
    name: Code Format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify format
        run: dotnet format --verify-no-changes --no-restore

  layering:
    name: Layering Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Kun.Core must have no third-party PackageReferences
        run: bash scripts/check-layering.sh

      - name: Identity log privacy and product-neutral defaults
        run: python3 scripts/check-identity-boundaries.py
