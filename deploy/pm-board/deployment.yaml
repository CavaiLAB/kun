apiVersion: apps/v1
kind: Deployment
metadata:
  name: qian-pm-board
spec:
  replicas: 1
  # 滚动更新（S1-PM-005）：新 Pod 就绪（首版看板生成完）后才停旧 Pod；新 Pod 拉不到镜像或排不上时，旧版照常提供看板。
  # 前提是 qd 的 CPU 请求余量放得下第二个 Pod。2026-11-17 qd 已请求 7995m / 8000m，只剩 5m，产品负责人定三个容器
  # 各请求 1m（原为 5m；2026-11-17 实测 git-sync 0m、builder 1m、nginx 1m），一个 Pod 共 3m；CPU 上限不变。
  # 余量不足时新 Pod 停在 Pending，不影响旧版。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: qian-pm-board
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qian-pm-board
    spec:
      # 与文档站一样固定在 qd：worker 节点从 registry.k8s.io 的镜像代理拉 git-sync 时会遇到 502（2026-10-15），
      # qd 上文档站已在用同版本的 git-sync 与 nginx 镜像，无需再拉
      nodeSelector:
        kubernetes.io/hostname: qd
      automountServiceAccountToken: false
      securityContext:
        # git-sync 默认以 65533 运行；nginx-unprivileged 可用任意 uid，统一成同一用户以便共享 emptyDir
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          env:
            # 迁移执行计划 B2：原 Qian 归档后任务文件在 CavaiLAB/kun 的 _import/qian/pm/tasks/ 下改。
            # CavaiLAB/kun 是公开仓库，经 HTTPS 匿名拉取，不需要 deploy key 与 Secret。
            - name: GITSYNC_REPO
              value: https://github.com/CavaiLAB/kun.git
            - name: GITSYNC_REF
              value: main
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: 60s
            - name: GITSYNC_DEPTH
              value: "1"
            - name: GITSYNC_MAX_FAILURES
              value: "-1"
          volumeMounts:
            - name: repo
              mountPath: /git
          resources:
            # CPU 请求 1m：qd 余量只剩 5m，2026-11-17 产品负责人定为 1m（实测 0–1m），上限不变，见上面 strategy 的注释
            requests: { cpu: 1m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        # 看板生成物不进 git（S1-PM-004）：每次 git-sync 换了提交，就用该提交的 <前缀>/scripts/pm.py 生成到 /site
        - name: builder
          image: python:3.13-alpine
          command: ["python3", "-u", "/opt/builder/builder.py"]
          env:
            # 前缀：scripts/pm.py 与 pm/tasks/ 在检出里所在的目录，空串表示检出根。只在这一处写：
            # builder 按它找 pm.py，并建 /site/source → /git/current/<前缀> 供 nginx 的 /tasks/ 取任务源文件。
            # 现在原 Qian 在过渡目录 _import/qian/ 里；pm/ 与 scripts/pm.py 提出过渡目录后只改这里。
            - name: BOARD_PREFIX
              value: _import/qian
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: site
              mountPath: /site
            - name: builder
              mountPath: /opt/builder
              readOnly: true
          resources:
            # CPU 请求 1m：qd 余量只剩 5m，2026-11-17 产品负责人定为 1m（实测 0–1m），上限不变，见上面 strategy 的注释
            requests: { cpu: 1m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: site
              mountPath: /site
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # 滚动更新时旧 Pod 先从 Service 端点里摘掉，各节点的转发规则随后才更新，这几秒里仍会有新连接进来。
          # 停 nginx 前先等 5 秒、照常服务，切换瞬间不丢请求（S1-PM-005：#141 上线时切换瞬间有 1 次连接被拒）。
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # 首版看板生成之前 / 返回 404，Pod 不就绪
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            # CPU 请求 1m：qd 余量只剩 5m，2026-11-17 产品负责人定为 1m（实测 0–1m），上限不变，见上面 strategy 的注释
            requests: { cpu: 1m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: repo
          emptyDir: {}
        - name: site
          emptyDir:
            sizeLimit: 64Mi
        - name: builder
          configMap:
            name: qian-pm-board-builder   # kustomize 由 builder.py 生成并加哈希后缀，改脚本即滚动更新
        - name: nginx-conf
          configMap:
            name: qian-pm-board-nginx
