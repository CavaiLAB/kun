name: qian-shell-federation

# 外壳联邦验收：执行 pnpm shell:federation，核对 MF2 的真实制品与审计链。
# 由 ci.yml 调用，在 _import/qian/ 下运行。
# 原件在 _import/qian/.github/workflows/shell-federation.yml，B1 历史导入时带来，不动，GitHub 不读。相对原件的改动：
# - 触发：只留 workflow_call 与 workflow_dispatch；推送与拉取请求的触发、路径过滤与并发组都由 ci.yml 管（S1-KUN-020）。
#   路径过滤在区域表 scripts/ci_changes.py 的 shell-federation 区域：原件的过滤逐条加 _import/qian/ 前缀，另加仓库根的 .NET 构建基线、
#   Kun.slnx、src/ 与 _import/qian/.npmrc。
# - 位置：run 步骤的工作目录、package.json 与上传路径加 _import/qian/ 前缀；setup-dotnet 读仓库根的 global.json。
# - 前端框架迁出（B11，见迁移执行计划）之后：前端框架装 CavaiLAB/qian 发布在 GitHub Packages 上的公开包
#   @cavailab/qian-*，用本次运行的 GITHUB_TOKEN 只读安装：权限加 packages: read，setup-node 写用户级的
#   包源认证，pnpm install 带 NODE_AUTH_TOKEN；区域里去掉迁走的目录。
# 检查本身不变。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 shell-federation），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
defaults:
  run:
    working-directory: _import/qian
jobs:
  acceptance:
    name: MF2 真实制品与审计链
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      QIAN_REQUIRE_DOCKER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: _import/qian/package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian-shell exec playwright install --with-deps chromium
      - run: pnpm shell:federation
      - name: 保留浏览器与无凭据验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-federation-report
          path: |
            _import/qian/apps/qian-shell/playwright-report
            _import/qian/apps/qian-shell/test-results
            _import/qian/apps/qian-shell/acceptance-results/audit-chain.json
            _import/qian/apps/qian-shell/acceptance-results/*.png
            _import/qian/apps/qian-shell/acceptance-results/first-screen.json
          if-no-files-found: ignore
