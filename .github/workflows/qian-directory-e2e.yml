name: qian-directory-e2e

# 真实目录选择器验收：验收页与用例在私有工作区包 tests/directory-e2e（@qian/directory-e2e）。
# 由 ci.yml 调用，在 _import/qian/ 下运行。
# 原件在 _import/qian/.github/workflows/directory-e2e.yml，B1 历史导入时带来，不动，GitHub 不读。相对原件的改动：
# - 触发：只留 workflow_call 与 workflow_dispatch；推送与拉取请求的触发、路径过滤与并发组都由 ci.yml 管（S1-KUN-020）。
#   路径过滤在区域表 scripts/ci_changes.py 的 directory-e2e 区域：原件的过滤逐条加 _import/qian/ 前缀，另加仓库根的 .NET 构建基线、
#   Kun.slnx、src/ 与 _import/qian/.npmrc；指向已不存在的 _import/qian/NuGet.config 的一条删掉。
# - 位置：run 步骤的工作目录、package.json 与上传路径加 _import/qian/ 前缀；setup-dotnet 读仓库根的 global.json。
# - 前端框架迁出（B11，见迁移执行计划）之后：验收页与用例移进 tests/directory-e2e；组件装 CavaiLAB/qian 发布在
#   GitHub Packages 上的公开包 @cavailab/qian-*，用本次运行的 GITHUB_TOKEN 只读安装：权限加 packages: read，
#   setup-node 写用户级的包源认证，pnpm install 带 NODE_AUTH_TOKEN。原件核对 biz 契约的一步（contracts:check）随前端
#   框架归 CavaiLAB/qian，这里改为核对钉住的 biz 契约副本与安装的包一致（tests/gates/ui/pins.test.ts）。
# 检查本身不变。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 directory-e2e），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
defaults:
  run:
    working-directory: _import/qian
jobs:
  acceptance:
    name: 真实目录选择器验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: _import/qian/package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @qian/directory-e2e exec playwright install --with-deps chromium
      - run: pnpm exec vitest run --project ui-gates tests/gates/ui/pins.test.ts && pnpm --filter @qian/directory-e2e typecheck
      - run: pnpm --filter @qian/directory-e2e e2e:directory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-e2e
          path: _import/qian/TestResults/directory-e2e/
          if-no-files-found: ignore
