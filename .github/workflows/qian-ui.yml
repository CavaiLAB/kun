name: qian-ui

# 在根工作区检查外壳和界面包的样式、依赖边界与国际化文本。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 ui），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  gate:
    name: 门禁 (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gate: [lint, typecheck, unit, boundaries, circular, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Playwright Chromium（unit 里的界面包浏览器测试）
        if: matrix.gate == 'unit'
        run: pnpm --filter @qian/identity-ui exec playwright install --with-deps chromium

      - name: lint（令牌门禁 + ESLint）
        if: matrix.gate == 'lint'
        run: pnpm ui:lint
      - name: typecheck（各包 + 门禁自测）
        if: matrix.gate == 'typecheck'
        run: pnpm ui:typecheck
      - name: unit（契约生成物、门禁自测、外壳接线、界面包浏览器测试）
        if: matrix.gate == 'unit'
        run: pnpm ui:test
      - name: boundaries（依赖边界）
        if: matrix.gate == 'boundaries'
        run: pnpm ui:boundaries
      - name: circular（循环依赖）
        if: matrix.gate == 'circular'
        run: pnpm ui:circular
      - name: build（外壳、界面包与参考远程的构建）
        if: matrix.gate == 'build'
        run: pnpm ui:build
