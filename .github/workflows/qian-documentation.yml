name: qian-documentation

# 检查事件声明与调用、CLI 文档模板，并核对 docs/generated 与当前源码的派生输出。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 documentation），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
permissions:
  contents: read
  packages: read
jobs:
  event-contracts:
    name: 派生文档与事件模式校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 源码根与源码目录（见文件开头）；在仓库根目录运行。
      DOCS_SOURCES: --source-root . --source packages --source plugins --source src --out docs/generated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian... build
      - name: 语义绑定及错误反例
        run: dotnet run --project tests/Kun.Docs.Tests -c Release
      - name: CLI 与文档模板验收
        run: pnpm --filter qian test
      - name: 当前源码声明与调用模式必须一致
        run: |
          mkdir -p TestResults
          pnpm exec qian docs generate --profile platform $DOCS_SOURCES --json > TestResults/docs-report.json 2> TestResults/docs-diagnostics.json || { cat TestResults/docs-diagnostics.json; exit 1; }
      # G2 文档新鲜度（ADR-020 D20.9、组件模型规格 §10.3、PRD §14 C18）：上一步已按当前源码重写 docs/generated，有修改或新文件即失败。
      - name: 派生文档新鲜度：docs/generated 必须与重新生成的结果一致
        run: |
          drift="$(git status --porcelain -- docs/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff --stat -- docs/generated
            echo "::error::docs/generated 与源码派生结果不一致：先 pnpm --filter qian... build，再在仓库根目录运行 pnpm exec qian docs generate --profile platform $DOCS_SOURCES，提交 docs/generated；也可下载本次运行的 derived-docs-and-events 产物（ADR-020 D20.9 / 组件模型规格 §10.3 G2）。"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-docs-and-events
          path: |
            docs/generated/
            TestResults/docs-*.json
