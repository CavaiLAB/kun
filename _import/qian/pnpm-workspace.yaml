# pnpm 工作区：文档站 website/、Qian 的 Node 包 packages/qian-*（命令行、校验库、外壳接线与三个界面包）、外壳应用 apps/*、
# 参考应用的远程模块 samples/qian-sample-crm-ui（S1-YUE-012）、OpenAPI 生成器与真实目录验收页 tests/directory-e2e。
# 前端框架不在工作区里：它在 CavaiLAB/qian，这里装已发布的 @cavailab/qian-*（S1-YUE-025）。
packages:
  - website
  - packages/qian-*
  - apps/*
  - samples/qian-sample-crm-ui
  - tools/openapi-codegen
  - tests/directory-e2e

# 允许跑 postinstall 的依赖（pnpm 12 默认拒绝未审核的构建脚本）：unrs-resolver 只在预编译二进制缺失时才编译。
allowBuilds:
  unrs-resolver: true
  esbuild: true # Vite 工具链，校验/安装官方平台二进制

# 版本目录：前端依赖只在这里钉一次，各包的 package.json 写 "catalog:"。
# typescript 钉 6.0.x：typescript-eslint 8 只支持 < 6.1。
catalog:
  # 前端框架（CavaiLAB/qian 发布在 GitHub Packages，包源见 .npmrc）：写精确版本，不写范围，升级走 PR、这几行一起改（S1-YUE-025）。
  # 文档站按 @cavailab/qian-core 的版本检出 CavaiLAB/qian 的同名标签取组件文档源；版本矩阵页也从这里读。
  # 命令行与校验库的测试另在各自的 package.json 里直接写 @cavailab/qian-runtime 的版本。
  "@cavailab/qian-tokens": 0.2.0
  "@cavailab/qian-contracts": 0.2.0
  "@cavailab/qian-sdk": 0.2.0
  "@cavailab/qian-core": 0.2.0
  "@cavailab/qian-form": 0.2.0
  "@cavailab/qian-data": 0.2.0
  "@cavailab/qian-shell": 0.2.0
  "@cavailab/qian-biz": 0.2.0
  "@cavailab/qian-plugin-sdk": 0.2.0
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@types/node": ^24.0.0
  typescript: ~6.0.3
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  vitest: ^5.0.3
  "@vitest/browser": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  playwright: ^1.64.0
  "@playwright/test": ^1.64.0
  "@axe-core/playwright": ^4.13.0
  axe-core: ^4.11.0
  "@testing-library/react": ^16.3.3
  "@testing-library/dom": ^10.4.2
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  "@rspress/shared": 2.0.23
  "@rsbuild/core": 2.2.10
  "@rsbuild/plugin-react": 2.1.0
  "@rsbuild/plugin-tailwindcss": 2.0.3
  "@babel/standalone": 7.28.5
  monaco-editor: 0.52.2
  "@module-federation/enhanced": 2.9.2
  "@module-federation/vite": 1.23.5

minimumReleaseAgeExclude:
  - "@playwright/test@1.64.0"
  - playwright-core@1.64.0
  - playwright@1.64.0
  - vite@8.3.4
  - lucide-react@1.56.0
  - react-resizable-panels@4.14.5
  - i18next@26.4.7
  - lossless-json@4.3.2
  - "@tanstack/react-virtual@3.14.21"
  - "@tanstack/virtual-core@3.19.6"
  - "@cavailab/qian-biz@0.2.0"
  - "@cavailab/qian-contracts@0.2.0"
  - "@cavailab/qian-core@0.2.0"
  - "@cavailab/qian-data@0.2.0"
  - "@cavailab/qian-form@0.2.0"
  - "@cavailab/qian-plugin-sdk@0.2.0"
  - "@cavailab/qian-runtime@0.2.0"
  - "@cavailab/qian-sdk@0.2.0"
  - "@cavailab/qian-shell@0.2.0"
  - "@cavailab/qian-tokens@0.2.0"

# OpenAPI 生成器的 peer 仅支持 TypeScript 5；隔离工具，不改变工作区 TypeScript 6 编译基线。
catalogs:
  openapi-codegen:
    typescript: 5.9.3
