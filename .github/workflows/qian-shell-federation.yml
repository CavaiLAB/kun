name: qian-shell-federation

# 通过真实浏览器验收外壳挂载和加载远程模块。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 shell-federation），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  acceptance:
    name: MF2 真实制品与审计链
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1
      QIAN_REQUIRE_DOCKER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian-shell exec playwright install --with-deps chromium
      - run: pnpm shell:federation
      - name: 保留浏览器与无凭据验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-federation-report
          path: |
            apps/qian-shell/playwright-report
            apps/qian-shell/test-results
            apps/qian-shell/acceptance-results/audit-chain.json
            apps/qian-shell/acceptance-results/*.png
            apps/qian-shell/acceptance-results/first-screen.json
          if-no-files-found: ignore
