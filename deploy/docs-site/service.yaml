apiVersion: v1
kind: Service
metadata:
  name: qian-docs-site
  annotations:
    # 在 MetalLB 的内网地址池里固定一个地址，内网直接用这个地址访问
    metallb.io/loadBalancerIPs: "192.168.1.211"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: qian-docs-site
  ports:
    - name: http
      port: 80
      targetPort: http
      # 固定 NodePort：从 WireGuard 侧用集群节点的管理地址加这个端口访问
      nodePort: 30820
