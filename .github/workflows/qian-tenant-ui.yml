name: qian-tenant-ui

# 在开发宿主上运行租户运营页面的七步验收。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 tenant-ui），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  acceptance:
    name: 真实租户运营页面七步验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @qian/tenancy-ui exec playwright install --with-deps chromium
      - run: pnpm --filter @qian/tenancy-ui contracts:check && pnpm exec turbo run typecheck build --filter=@qian/tenancy-ui
      - run: pnpm --filter @qian/tenancy-ui e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-ui-acceptance
          path: TestResults/tenant-ui/
          if-no-files-found: error
