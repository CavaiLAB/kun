apiVersion: apps/v1
kind: Deployment
metadata:
  name: qian-docs-site
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qian-docs-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qian-docs-site
    spec:
      nodeSelector:
        kubernetes.io/hostname: qd
      automountServiceAccountToken: false
      securityContext:
        # git-sync 默认以 65533 运行；nginx-unprivileged 可用任意 uid，统一成同一用户以便共享 emptyDir
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          env:
            # 文档站由 CavaiLAB/kun 根上的 qian-docs-site 工作流发布到本仓库的 docs-site 分支。
            # 公开仓库，经 HTTPS 匿名拉取，不需要 deploy key 与 Secret。
            - name: GITSYNC_REPO
              value: https://github.com/CavaiLAB/kun.git
            # CI 把构建产物发布到 docs-site 分支（每次一个强推的提交，见 publish.sh）
            - name: GITSYNC_REF
              value: docs-site
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            - name: GITSYNC_PERIOD
              value: 60s
            - name: GITSYNC_DEPTH
              value: "1"
            - name: GITSYNC_MAX_FAILURES
              value: "-1"
          volumeMounts:
            - name: repo
              mountPath: /git
          resources:
            requests: { cpu: 10m, memory: 2Gi }
            limits: { cpu: 300m, memory: 5Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: repo
              mountPath: /git
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: repo
          # 可从 docs-site 重建的缓存放入内存，隔离与 qd etcd 共用的根盘写入。
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: nginx-conf
          configMap:
            name: qian-docs-site-nginx
