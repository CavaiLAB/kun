apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../deploy/pm-board
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: qian-pm-board
    patch: |-
      - op: test
        path: /spec/template/spec/containers/1/name
        value: builder
      - op: test
        path: /spec/template/spec/containers/1/env/0/name
        value: BOARD_PREFIX
      - op: replace
        path: /spec/template/spec/containers/1/env/0/value
        value: _import/qian
