name: qian-docs-site

# 原 Qian 的 docs-site 工作流，B1 历史导入时接到本仓库（迁移执行计划 B1，S1-KUN-019），B2 切换时接上正式站点的发布。
# 原件在 _import/qian/.github/workflows/docs-site.yml，不动；GitHub 只读仓库根的 .github/workflows/。
# 相对原件改了这些：
# - 位置：run 步骤的工作目录、路径过滤、缓存键、package.json、github.workspace 下的路径、
#   浏览器验收容器挂载的目录、上传路径都加了 _import/qian/ 前缀；路径过滤末尾加上本文件。
# - 「Kun 框架」小节照原件按 Directory.Packages.props 的 KunVersion 取 Kun 的 tag，但不再另外检出 kun 仓库：两个旧仓库的
#   历史与版本标签已带着原提交号导入本仓库，同名 tag 指向同一提交，所以只从本仓库取这一个 tag 与它的历史，生成脚本
#  （_import/qian/website/scripts/kun.ts）直接读本仓库，不设 KUN_DOCS_PATH。原件的 deploy key 与「检查 kun 仓库只读凭据」
#   一步都用不上，没有接。
# - 发布（B2 接上）：与原件一样只在 main 上发布正式站点（push 到 main，或在 main 上手动触发），用
#   _import/qian/deploy/docs-site/publish.sh main 把构建产物推到本仓库的 docs-site 分支，集群里的 git-sync 拉这个分支
#  （_import/qian/deploy/docs-site/）。作业权限只要 contents: write（原件另有 pull-requests: write，只给 PR 评论用）。
#   运行摘要只写发布的路径与来源提交，不写访问入口：原件的 DOCS_ORIGIN_WG、DOCS_ORIGIN_LAN 是内网地址，本仓库公开，
#   这两个环境变量不接。
# - PR 预览暂不发布：原件对同仓库分支的 PR 发布 /pr-preview/pr-<n>/、在 PR 里留带内网入口的评论、PR 关闭时删除预览。
#   公开仓库的 PR 评论人人可见，要不要接、评论里写什么由产品负责人定，所以原件发布作业里预览的分支、PR 评论一步与
#   「删除预览」作业都没有接，触发类型里也就没有只为删除预览而设的 closed，构建作业也不用跳过 closed。
#   PR 上的构建仍带 /pr-preview/pr-<n>/ 前缀，前缀检查照跑。接回时照原件补齐这几处即可。
# - 组件目录（S1-YUE-025）：qian 组件库（原 yue）的源码迁到了 CavaiLAB/qian。构建按 pnpm-workspace.yaml 版本目录里
#   @cavailab/qian-core 的版本，检出 CavaiLAB/qian 的同名标签 @cavailab/qian-core@<版本> 到 _import/qian/.qian（公开仓库，
#   缺省的 GITHUB_TOKEN 经 HTTPS 只读检出；要完整历史，组件页的 updated 取文件在该标签上的最后提交日期），在检出里按它自己的
#   锁文件装 packages/qian/* 的依赖（公共 npm 源），QIAN_DOCS_PATH 指向它（website/README.md §1）。本仓库的依赖里有 GitHub Packages
#   上的公开包 @cavailab/qian-*：工作流权限加 packages: read，setup-node 写用户级的包源认证，pnpm install 带 NODE_AUTH_TOKEN。
#   路径过滤去掉迁走的 packages/yue/，加上浏览器验收引用的外壳 e2e/settle.ts。
# S1-KUN-020：改由 ci.yml 调用（workflow_call，留着手动触发），推送与拉取请求的触发、并发组都由 ci.yml 管；
# 路径过滤搬进区域表 scripts/ci_changes.py 的 docs-site 区域，另加仓库根的 .NET 构建基线、Kun.slnx、src/ 与 _import/qian/.npmrc；
# setup-dotnet 改读仓库根的 global.json。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 docs-site），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: _import/qian

jobs:
  build:
    name: 构建与检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.pull_request.number) || '/' }}
      QIAN_DOCS_PATH: ${{ github.workspace }}/_import/qian/.qian
    steps:
      - uses: actions/checkout@v4

      - name: 读 KunVersion
        id: kun
        run: |
          version="$(sed -n 's:.*<KunVersion>\(.*\)</KunVersion>.*:\1:p' Directory.Packages.props | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=_import/qian/Directory.Packages.props::缺少 <KunVersion>：Kun 小节按它镜像，不回退 main（docs-site.md §2b.1）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 全部历史：镜像页的 updated 取源文件在该 tag 上的最后提交日期。不带 --depth，浅检出里取到的也是这个 tag 的完整历史
      - name: 取本仓库的 Kun 标签 v${{ steps.kun.outputs.version }}
        env:
          KUN_TAG: v${{ steps.kun.outputs.version }}
        run: git fetch --no-tags origin "+refs/tags/$KUN_TAG:refs/tags/$KUN_TAG"

      - name: 读前端框架版本（版本目录里的 @cavailab/qian-core）
        id: qian
        run: |
          version="$(sed -n 's/^[[:space:]]*"@cavailab\/qian-core":[[:space:]]*\([^[:space:]#]*\).*/\1/p' pnpm-workspace.yaml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=_import/qian/pnpm-workspace.yaml::版本目录里缺少 @cavailab/qian-core：组件目录按它检出 CavaiLAB/qian 的同名标签"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 全部历史：组件页的 updated 取源文件在该标签上的最后提交日期
      - name: 检出 CavaiLAB/qian 的 @cavailab/qian-core@${{ steps.qian.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: CavaiLAB/qian
          ref: refs/tags/@cavailab/qian-core@${{ steps.qian.outputs.version }}
          path: _import/qian/.qian
          fetch-depth: 0
          persist-credentials: false

      # DocFX 从 Kun.* 包生成 API 参考（website/.config/dotnet-tools.json 锁定 docfx 版本）
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-docs-${{ runner.os }}-${{ steps.kun.outputs.version }}-${{ hashFiles('_import/qian/website/.config/dotnet-tools.json') }}
          restore-keys: nuget-docs-${{ runner.os }}-

      # 先装 Node 24 再装 pnpm：pnpm 版本取自原 Qian 根目录 package.json 的 packageManager，它本身要求较新的 Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: _import/qian/package.json
      - name: pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('_import/qian/pnpm-lock.yaml', '_import/qian/.qian/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # 只装 8 个层包的依赖，按检出里 qian 自己的锁文件（website/scripts/qian.ts 的 QIAN_INSTALL_ARGS）
      - name: 安装组件文档源的依赖（CavaiLAB/qian 检出）
        working-directory: _import/qian/.qian
        run: pnpm install --frozen-lockfile --filter "./packages/qian/*"

      - name: 类型检查
        run: pnpm --filter website typecheck

      - name: 生成器单测
        run: pnpm --filter website test

      - name: 构建站点（含断链检查）
        run: pnpm --filter website build

      - name: 产物检查（离线、前缀、搜索索引、代码高亮、Kun 版本）
        run: pnpm --filter website check

      # Kun 镜像页与 API 参考的源不在原 Qian 里，生成后单独过文档门禁（禁用词、表格、断链）
      - name: 生成页过文档门禁（frontmatter、禁用词、链接；源不在本仓库的 Kun 页也在内）
        run: python3 scripts/check_docs.py website/docs/components website/docs/cli website/docs/design website/docs/sdk/kun website/docs/sdk/api website/docs/start/versions.md

      - name: Chromium 与真实组件交互验收
        run: |
          node -e "if (require('./website/node_modules/@playwright/test/package.json').version !== '1.64.0') throw new Error('更新 Playwright 时须同步文档浏览器镜像版本。')"
          mkdir -p website/.browser-results
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" \
            -e CI=1 -e DOCS_BASE -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=/workspace/website/.browser-results/playwright-report \
            -v "$GITHUB_WORKSPACE/_import/qian:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/_import/qian/website/.browser-results:/workspace/website/.browser-results:rw" \
            -w /workspace/website \
            mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test --output .browser-results/test-results

      - name: 上传浏览器失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-report
          path: _import/qian/website/.browser-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _import/qian/website/doc_build
          retention-days: 7

  publish:
    name: 发布
    needs: build
    # 只在 main 上发布正式站点；PR 预览暂不发布（见文件头）
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - name: 推送到 docs-site 分支
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}
        run: deploy/docs-site/publish.sh main "$RUNNER_TEMP/docs-site"

      - name: 记录发布结果
        run: |
          {
            echo "### 文档站已发布"
            echo ""
            echo "- 分支 \`docs-site\` 的根目录，来源提交 \`${GITHUB_SHA:0:12}\`"
            echo ""
            echo "git-sync 每 60 秒拉取一次 docs-site 分支，推送后约一分钟可见；访问入口见 _import/qian/deploy/docs-site/README.md。"
          } >> "$GITHUB_STEP_SUMMARY"
