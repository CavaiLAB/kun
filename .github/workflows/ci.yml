    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: 判定：变更检测成功，且没有失败或取消的作业（跳过算通过）
        env:
