name: qian-dev-tenant-ops

# 租户运营手测环境的冒烟：原样执行 scripts/dev-tenant-ops.sh smoke（脚本按自身位置定 _import/qian/ 为根）。
# 由 ci.yml 调用，在 _import/qian/ 下运行。
# 原件在 _import/qian/.github/workflows/dev-tenant-ops.yml，B1 历史导入时带来，不动，GitHub 不读。相对原件的改动：
# - 触发：只留 workflow_call 与 workflow_dispatch；推送与拉取请求的触发、路径过滤与并发组都由 ci.yml 管（S1-KUN-020）。
#   路径过滤在区域表 scripts/ci_changes.py 的 dev-tenant-ops 区域：原件的过滤逐条加 _import/qian/ 前缀，另加仓库根的 .NET 构建基线、
#   Kun.slnx 与 src/；指向已不存在的 _import/qian/NuGet.config 的一条删掉。
# - 位置：run 步骤的工作目录加 _import/qian/ 前缀；setup-dotnet 读仓库根的 global.json。
# 检查本身不变。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 dev-tenant-ops），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: _import/qian

jobs:
  smoke:
    name: 手测环境冒烟（up + walkthrough）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 起环境、走查、停宿主（与本机 scripts/dev-tenant-ops.sh smoke 同一条命令）
        env:
          QIAN_DEV_SMOKE_LOG: ${{ runner.temp }}/dev-tenant-ops-up.log
        run: scripts/dev-tenant-ops.sh smoke

      - name: 失败时上传宿主日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-tenant-ops-up-log
          path: ${{ runner.temp }}/dev-tenant-ops-up.log
          if-no-files-found: ignore
