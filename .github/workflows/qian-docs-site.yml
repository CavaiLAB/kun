name: qian-docs-site

# 从钉住的框架源码构建文档站、检查页面和锚点，并在主干发布构建产物。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 docs-site），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: 构建与检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.pull_request.number) || '/' }}
      QIAN_DOCS_PATH: ${{ github.workspace }}/.qian
    steps:
      - uses: actions/checkout@v4

      # 与 website/scripts/kun.ts 的 readKunVersion 同一规则：第一个不是 [Unreleased] 的「## [版本]」段
      - name: 验证文档站部署入口
        run: kubectl kustomize deploy/docs-site > /dev/null

      - name: 读 Kun 最新的发布版（仓库根 CHANGELOG.md）
        id: kun
        run: |
          version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' "$GITHUB_WORKSPACE/CHANGELOG.md" | grep -v -i -x 'unreleased' | head -n 1 || true)"
          if [ -z "$version" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md 里没有已发布的版本段：Kun 小节按最新的发布版镜像，不回退 main（docs-site.md §2b.1）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 全部历史：镜像页的 updated 取源文件在该 tag 上的最后提交日期。不带 --depth，浅检出里取到的也是这个 tag 的完整历史
      - name: 取本仓库的 Kun 标签 v${{ steps.kun.outputs.version }}
        env:
          KUN_TAG: v${{ steps.kun.outputs.version }}
        run: git fetch --no-tags origin "+refs/tags/$KUN_TAG:refs/tags/$KUN_TAG"

      - name: 读前端框架版本（版本目录里的 @cavailab/qian-core）
        id: qian
        run: |
          version="$(sed -n 's/^[[:space:]]*"@cavailab\/qian-core":[[:space:]]*\([^[:space:]#]*\).*/\1/p' pnpm-workspace.yaml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=pnpm-workspace.yaml::版本目录里缺少 @cavailab/qian-core：组件目录按它检出 CavaiLAB/qian 的同名标签"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 全部历史：组件页的 updated 取源文件在该标签上的最后提交日期
      - name: 检出 CavaiLAB/qian 的 @cavailab/qian-core@${{ steps.qian.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: CavaiLAB/qian
          ref: refs/tags/@cavailab/qian-core@${{ steps.qian.outputs.version }}
          path: .qian
          fetch-depth: 0
          persist-credentials: false

      # DocFX 从 Kun.* 包生成 API 参考（website/.config/dotnet-tools.json 锁定 docfx 版本）
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-docs-${{ runner.os }}-${{ steps.kun.outputs.version }}-${{ hashFiles('website/.config/dotnet-tools.json') }}
          restore-keys: nuget-docs-${{ runner.os }}-

      # 先装 Node 24 再装 pnpm：pnpm 版本取自 package.json 的 packageManager，它本身要求较新的 Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - name: pnpm 缓存目录
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.qian/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 安装依赖
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # 只装 8 个层包的依赖，按检出里 qian 自己的锁文件（website/scripts/qian.ts 的 QIAN_INSTALL_ARGS）
      - name: 安装组件文档源的依赖（CavaiLAB/qian 检出）
        working-directory: .qian
        run: pnpm install --frozen-lockfile --filter "./packages/qian/*"

      - name: 类型检查
        run: pnpm --filter website typecheck

      - name: 生成器单测
        run: pnpm --filter website test

      - name: 构建站点（含断链检查）
        run: pnpm --filter website build

      - name: 产物检查（离线、前缀、搜索索引、代码高亮、Kun 版本）
        run: pnpm --filter website check

      # Kun 镜像页与 API 参考生成后单独过文档门禁（禁用词、表格、断链）
      - name: 生成页过文档门禁（frontmatter、禁用词、链接；源不在本仓库的 Kun 页也在内）
        run: python3 scripts/check_docs.py website/docs/components website/docs/cli website/docs/design website/docs/sdk/kun website/docs/sdk/api website/docs/start/versions.md

      - name: Chromium 与真实组件交互验收
        run: |
          node -e "if (require('./website/node_modules/@playwright/test/package.json').version !== '1.64.0') throw new Error('更新 Playwright 时须同步文档浏览器镜像版本。')"
          mkdir -p website/.browser-results
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" \
            -e CI=1 -e DOCS_BASE -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            -e PLAYWRIGHT_HTML_OUTPUT_DIR=/workspace/website/.browser-results/playwright-report \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/website/.browser-results:/workspace/website/.browser-results:rw" \
            -w /workspace/website \
            mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test --output .browser-results/test-results

      - name: 上传浏览器失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-report
          path: website/.browser-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/doc_build
          retention-days: 7

  publish:
    name: 发布
    needs: build
    # 只在 main 上发布正式站点；PR 预览暂不发布（见文件头）
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site

      - name: 推送到 docs-site 分支
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}
        run: deploy/docs-site/publish.sh main "$RUNNER_TEMP/docs-site"

      - name: 记录发布结果
        run: |
          {
            echo "### 文档站已发布"
            echo ""
            echo "- 分支 \`docs-site\` 的根目录，来源提交 \`${GITHUB_SHA:0:12}\`"
            echo ""
            echo "git-sync 每 60 秒拉取一次 docs-site 分支，推送后约一分钟可见；访问入口见 deploy/docs-site/README.md。"
          } >> "$GITHUB_STEP_SUMMARY"
