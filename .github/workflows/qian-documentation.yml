name: qian-documentation

# 派生文档与事件模式校验：语义绑定与错误反例、CLI 与文档模板验收、源码声明与调用模式一致，
# docs/generated 与重新生成的结果一致。由 ci.yml 调用，在 _import/qian/ 下运行。
# 原件在 _import/qian/.github/workflows/documentation.yml，B1 历史导入时带来，不动，GitHub 不读。相对原件的改动：
# - 触发：只留 workflow_call；推送与拉取请求的触发、路径过滤与并发组都由 ci.yml 管（S1-KUN-020）。
#   路径过滤在区域表 scripts/ci_changes.py 的 documentation 区域：原件的过滤逐条加 _import/qian/ 前缀，另加仓库根的 .NET 构建基线、
#   Kun.slnx、src/ 与 _import/qian/.npmrc。
# - 位置：run 步骤的工作目录、package.json 与上传路径加 _import/qian/ 前缀；setup-dotnet 读仓库根的 global.json。
#   派生文档新鲜度用 git status 看 docs/generated，pathspec 相对工作目录，看的仍是 _import/qian/docs/generated。
# - 前端框架迁出（B11，见迁移执行计划）之后：TypeScript 运行时装 CavaiLAB/qian 发布在 GitHub Packages 上的
#   @cavailab/qian-runtime，去掉构建 packages/qian-runtime 一步；命令行测试里有运行时一致性用例的 TS 一侧，区域含
#   tck/runtime/。装依赖要读 GitHub Packages 上的公开包，
#   用本次运行的 GITHUB_TOKEN 只读安装：权限加 packages: read，setup-node 写用户级的包源认证，
#   pnpm install 带 NODE_AUTH_TOKEN。
# - 事件图的源码根取仓库根（S1-KUN-029）：生成命令带 --source-root ../..，源码目录相对仓库根写成 _import/qian/packages、
#   _import/qian/plugins 与 src，搬出过渡目录、进了仓库根 src/ 的包仍在扫描范围内；事件图里的位置相对仓库根书写。
#   命令写在作业的 DOCS_SOURCES 里，生成一步与漂移提示共用。
# 除了扫描范围，检查本身不变。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 documentation），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
permissions:
  contents: read
  packages: read
defaults:
  run:
    working-directory: _import/qian
jobs:
  event-contracts:
    name: 派生文档与事件模式校验
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 源码根与源码目录（见文件开头）；在 _import/qian/ 下运行，../.. 是仓库根。
      DOCS_SOURCES: --source-root ../.. --source _import/qian/packages --source _import/qian/plugins --source src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: _import/qian/package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian... build
      - name: 语义绑定及错误反例
        run: dotnet run --project ../../tests/Kun.Docs.Tests -c Release
      - name: CLI 与文档模板验收
        run: pnpm --filter qian test
      - name: 当前源码声明与调用模式必须一致
        run: |
          mkdir -p TestResults
          pnpm exec qian docs generate --profile platform $DOCS_SOURCES --json > TestResults/docs-report.json 2> TestResults/docs-diagnostics.json || { cat TestResults/docs-diagnostics.json; exit 1; }
      # G2 文档新鲜度（ADR-020 D20.9、组件模型规格 §10.3、PRD §14 C18）：上一步已按当前源码重写 docs/generated，有修改或新文件即失败。
      - name: 派生文档新鲜度：docs/generated 必须与重新生成的结果一致
        run: |
          drift="$(git status --porcelain -- docs/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff --stat -- docs/generated
            echo "::error::docs/generated 与源码派生结果不一致：先 pnpm --filter qian... build，再在 _import/qian 下 pnpm exec qian docs generate --profile platform $DOCS_SOURCES，提交 docs/generated；也可下载本次运行的 derived-docs-and-events 产物（ADR-020 D20.9 / 组件模型规格 §10.3 G2）。"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-docs-and-events
          path: |
            _import/qian/docs/generated/
            _import/qian/TestResults/docs-*.json
