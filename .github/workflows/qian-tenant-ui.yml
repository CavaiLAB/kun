name: qian-tenant-ui
# 原 Qian 的 tenant-ui 工作流，B1 历史导入时接到本仓库（迁移执行计划 B1，S1-KUN-019）。
# 原件在 _import/qian/.github/workflows/tenant-ui.yml，不动；GitHub 只读仓库根的 .github/workflows/。
# 相对原件只改了位置：run 步骤的工作目录、路径过滤、global.json 与 package.json、上传路径加 _import/qian/ 前缀；
# 路径过滤末尾加上本文件。检查本身不变：页面七步跑在 dev-tenant-ops.sh 装配的真实宿主上。
on:
  push:
    branches: [main]
    paths: ['_import/qian/packages/qian-tenancy-ui/**', '_import/qian/packages/qian-plugin-sdk/**', '_import/qian/packages/qian-runtime/**', '_import/qian/turbo.json', '_import/qian/packages/yue/**', '_import/qian/packages/Qian.*/**', '_import/qian/packages/Common/**', '_import/qian/samples/Qian.Sample.Crm/**', '_import/qian/plugins/**', '_import/qian/schemas/**', '_import/qian/contracts/**', '_import/qian/tools/Qian.Dev.TenantOps/**', '_import/qian/tools/Qian.Build.Analyzers/**', '_import/qian/tools/openapi-codegen/**', '_import/qian/scripts/dev-tenant-ops.sh', '_import/qian/Directory.*.props', '_import/qian/Directory.Build.targets', '_import/qian/global.json', '_import/qian/NuGet.config', '_import/qian/BannedSymbols.txt', '_import/qian/.editorconfig', '_import/qian/package.json', '_import/qian/pnpm-lock.yaml', '_import/qian/pnpm-workspace.yaml', '_import/qian/.github/workflows/tenant-ui.yml', '.github/workflows/qian-tenant-ui.yml']
  pull_request:
    paths: ['_import/qian/packages/qian-tenancy-ui/**', '_import/qian/packages/qian-plugin-sdk/**', '_import/qian/packages/qian-runtime/**', '_import/qian/turbo.json', '_import/qian/packages/yue/**', '_import/qian/packages/Qian.*/**', '_import/qian/packages/Common/**', '_import/qian/samples/Qian.Sample.Crm/**', '_import/qian/plugins/**', '_import/qian/schemas/**', '_import/qian/contracts/**', '_import/qian/tools/Qian.Dev.TenantOps/**', '_import/qian/tools/Qian.Build.Analyzers/**', '_import/qian/tools/openapi-codegen/**', '_import/qian/scripts/dev-tenant-ops.sh', '_import/qian/Directory.*.props', '_import/qian/Directory.Build.targets', '_import/qian/global.json', '_import/qian/NuGet.config', '_import/qian/BannedSymbols.txt', '_import/qian/.editorconfig', '_import/qian/package.json', '_import/qian/pnpm-lock.yaml', '_import/qian/pnpm-workspace.yaml', '_import/qian/.github/workflows/tenant-ui.yml', '.github/workflows/qian-tenant-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qian-tenant-ui-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: _import/qian
jobs:
  acceptance:
    name: 真实租户运营页面七步验收
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: _import/qian/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: _import/qian/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qian/tenancy-ui exec playwright install --with-deps chromium
      - run: pnpm --filter @qian/tenancy-ui contracts:check && pnpm exec turbo run typecheck build --filter=@qian/tenancy-ui
      - run: pnpm --filter @qian/tenancy-ui e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-ui-acceptance
          path: _import/qian/TestResults/tenant-ui/
          if-no-files-found: error
