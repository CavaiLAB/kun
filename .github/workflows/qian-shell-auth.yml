name: qian-shell-auth
# 原 Qian 的 shell-auth 工作流，B1 历史导入时接到本仓库（迁移执行计划 B1，S1-KUN-019）。
# 原件在 _import/qian/.github/workflows/shell-auth.yml，不动；GitHub 只读仓库根的 .github/workflows/。
# 相对原件只改了位置：run 步骤的工作目录、路径过滤、global.json 与 package.json、上传路径加 _import/qian/ 前缀；
# 路径过滤末尾加上本文件。检查本身不变：执行 pnpm shell:auth（原件里叫 pnpm yue:auth；外壳认证真实流程验收，验收范围见原件的注释）。
# S1-YUE-025：前端框架改装 CavaiLAB/qian 发布在 GitHub Packages 上的 @cavailab/qian-*（公开包，用本次运行的 GITHUB_TOKEN 只读安装：
# 权限加 packages: read，setup-node 写用户级的包源认证，pnpm install 带 NODE_AUTH_TOKEN）；路径过滤去掉迁走的目录。
# S1-KUN-020：改由 ci.yml 调用（workflow_call，留着手动触发），推送与拉取请求的触发、并发组都由 ci.yml 管；
# 路径过滤搬进区域表 scripts/ci_changes.py 的 shell-auth 区域，另加仓库根的 .NET 构建基线、Kun.slnx、src/ 与 _import/qian/.npmrc；
# 去掉指向已不存在的 _import/qian/NuGet.config 的一条；
# setup-dotnet 改读仓库根的 global.json。

on:
  # 由 ci.yml 调用：路径过滤在 scripts/ci_changes.py 的区域表（区域 shell-auth），并发组由 ci.yml 统一管（S1-KUN-020）。
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
defaults:
  run:
    working-directory: _import/qian
jobs:
  acceptance:
    name: 外壳认证真实流程验收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@cavailab'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          package_json_file: _import/qian/package.json
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter qian-shell exec playwright install --with-deps chromium
      - run: pnpm exec turbo run typecheck --filter=@qian/identity-ui --filter=@qian/shell-kit --filter=@qian/sample-crm-ui --filter=@qian/tenancy-ui --filter=@qian/tenancy-signup-ui --filter=qian-shell
      - name: 真实流程验收（与本机 scripts/dev-shell.sh e2e 同一入口）
        run: pnpm shell:auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-auth-acceptance
          path: _import/qian/TestResults/shell-auth/
          if-no-files-found: ignore
